name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runner không có `.env` (đã gitignore), trong khi tokenManager.util validate
    # JWT secret ngay lúc require → thiếu 2 biến này là mọi suite chạm auth/MFA
    # fail ở bước load module. Giá trị dưới đây là rác dùng riêng cho CI: chỉ cần
    # đủ 32 ký tự và không khớp /^your_|^change_me/. Secret thật KHÔNG đặt ở đây.
    env:
      JWT_SECRET: ci-throwaway-value-not-a-real-secret-access
      JWT_SECRET_REFRESH: ci-throwaway-value-not-a-real-secret-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test -- --runInBand
      - run: pnpm run test:coverage -- --runInBand
      - run: pnpm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error --severity ERROR

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
