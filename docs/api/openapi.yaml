openapi: 3.1.0
info:
  title: Cẩm Phả GIS Server API
  version: 1.0.0
  description: API quản lý dữ liệu GIS và ngập lụt TP Cẩm Phả.
servers:
  - url: http://localhost:3006
    description: Local development
  - url: / 
    description: Current host
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: System Logs
  - name: Storage
  - name: Maps
  - name: Web Map
  - name: Layer Management
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, const: OK }
                  timestamp: { type: string, format: date-time }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Refresh token rotated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: setupMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaChallengeRequest' }
      responses:
        '200': { description: One-time Base32 secret and otpauth URI, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MfaChallengeRequest'
                - type: object
                  required: [code]
                  properties:
                    code: { type: string, pattern: '^\\d{6}$', writeOnly: true }
      responses:
        '200': { description: MFA enabled; recovery codes returned once, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200': { description: MFA verified; token pair issued, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listOwnSessions
      responses:
        '200': { description: Active refresh-token sessions for current user, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      operationId: revokeAllOwnSessions
      responses:
        '200': { description: All sessions revoked and token version incremented, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: revokeOwnSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Session revoked when it belongs to current user, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: roleCode, in: query, schema: { $ref: '#/components/schemas/RoleCode' } }
        - { name: q, in: query, description: 'Tìm theo id, email, họ tên, số điện thoại hoặc vai trò', schema: { type: string, maxLength: 255 } }
      responses:
        '200':
          description: Organization-scoped users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created in actor organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Organization-scoped user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User soft-deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{id}/role:
    patch:
      tags: [Users]
      operationId: changeUserRole
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode]
              properties:
                roleCode: { $ref: '#/components/schemas/RoleCode' }
      responses:
        '200':
          description: Role changed; only actors with users.change_role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/system-logs:
    get:
      tags: [System Logs]
      operationId: listSystemLogs
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: source, in: query, schema: { type: string, maxLength: 50 } }
      responses:
        '200':
          description: System log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/system-logs/cleanup:
    delete:
      tags: [System Logs]
      operationId: cleanupSystemLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [olderThanDays]
              properties:
                olderThanDays: { type: integer, minimum: 1, maximum: 3650, default: 90 }
      responses:
        '200':
          description: Old logs deleted and cleanup action audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/storage/uploads/presign:
    post:
      tags: [Storage]
      operationId: createStoragePresign
      summary: Create a quarantine-only presigned PUT URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category, originalName, contentType]
              properties:
                category: { type: string, enum: [layers, raster, documents, field-photos] }
                originalName: { type: string, minLength: 1, maxLength: 255 }
                contentType: { type: string, maxLength: 150 }
                expireSeconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
      responses:
        '201': { description: Quarantine upload URL created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: File category or extension rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/storage/uploads/{id}/commit:
    post:
      tags: [Storage]
      operationId: commitStorageUpload
      summary: Verify magic bytes, scan with ClamAV, hash, then promote from quarantine
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Clean object promoted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Object exceeds category size limit, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Signature mismatch or malware detected, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: Malware scanner unavailable; upload remains quarantined, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/storage/objects/{id}/download-url:
    get:
      tags: [Storage]
      operationId: getStorageDownloadUrl
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: expireSeconds
          in: query
          schema: { type: integer, minimum: 60, maximum: 3600, default: 900 }
      responses:
        '200': { description: Owner-only presigned download URL, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/storage/objects/{id}:
    delete:
      tags: [Storage]
      operationId: deleteStorageObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Owner object deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/maps/layers/{layerId}/wms:
    get:
      tags: [Maps]
      operationId: proxyLayerWms
      summary: ACL-controlled WMS GetMap; upstream layer name is forced from the database
      parameters:
        - $ref: '#/components/parameters/LayerId'
        - { name: request, in: query, required: true, schema: { type: string, const: GetMap } }
        - { name: bbox, in: query, required: true, schema: { type: string } }
        - { name: width, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 4096 } }
        - { name: height, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 4096 } }
        - { name: version, in: query, schema: { type: string, enum: ['1.3.0'], default: '1.3.0' } }
        - { name: crs, in: query, schema: { type: string, enum: ['EPSG:4326', 'EPSG:5899'], default: 'EPSG:4326' } }
        - { name: format, in: query, schema: { type: string, enum: [image/png, image/jpeg], default: image/png } }
      responses:
        '200': { description: Map image }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/maps/layers/{layerId}/wfs:
    get:
      tags: [Maps]
      operationId: proxyLayerWfs
      summary: ACL export-controlled, read-only WFS GetFeature
      parameters:
        - $ref: '#/components/parameters/LayerId'
        - { name: request, in: query, required: true, schema: { type: string, const: GetFeature } }
        - { name: bbox, in: query, schema: { type: string } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
        - { name: srsName, in: query, schema: { type: string, enum: ['EPSG:4326', 'EPSG:5899'], default: 'EPSG:4326' } }
      responses:
        '200': { description: GeoJSON FeatureCollection }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/layers/imports/shapefile:
    post:
      tags: [Layer Management]
      operationId: enqueueShapefileImport
      summary: Queue one clean Shapefile ZIP for PostGIS import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShapefileImportRequest' }
      responses:
        '201': { description: Import queued, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Source object is not an owned ready/clean layer file }
  /api/v1/admin/layers/imports/excel:
    post:
      tags: [Layer Management]
      operationId: enqueueExcelImport
      summary: Queue one clean XLSX worksheet for POINT import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExcelImportRequest' }
      responses:
        '201': { description: Import queued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Source object is not an owned ready/clean layer file }
  /api/v1/admin/layers/imports/{jobId}:
    get:
      tags: [Layer Management]
      operationId: getLayerImport
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Import status and bounded summary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/layers/imports/{jobId}/errors:
    get:
      tags: [Layer Management]
      operationId: listLayerImportErrors
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, enum: [10, 20, 50, 100], default: 20 } }
      responses:
        '200': { description: Paginated per-row import errors }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/layers:
    get:
      tags: [Layer Management]
      operationId: listManagedLayers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, enum: [10, 20, 50, 100], default: 20 } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string, maxLength: 50 } }
        - { name: geometryType, in: query, schema: { type: string, enum: [POINT, MULTIPOINT, LINESTRING, MULTILINESTRING, POLYGON, MULTIPOLYGON, RASTER] } }
        - { name: isPublic, in: query, schema: { type: boolean } }
        - { name: sortBy, in: query, schema: { type: string, enum: [created_at, updated_at, name_vi, code, category], default: updated_at } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200': { description: Paginated active layers }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/layers/{layerId}:
    get:
      tags: [Layer Management]
      operationId: getManagedLayer
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      responses:
        '200': { description: Layer metadata and role ACL }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Layer Management]
      operationId: updateManagedLayer
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayerUpdateRequest' }
      responses:
        '200': { description: Layer updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Layer Management]
      operationId: deleteManagedLayer
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200': { description: Layer soft-deleted and cleanup queued }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/layers/{layerId}/permissions:
    put:
      tags: [Layer Management]
      operationId: replaceLayerPermissions
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayerPermissionsRequest' }
      responses:
        '200': { description: Role ACL atomically replaced }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid role or ACL exceeds role contract }
  /api/v1/admin/layers/{layerId}/publish:
    post:
      tags: [Layer Management]
      operationId: retryLayerPublish
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      responses:
        '200': { description: Layer published to GeoServer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Layer is not a PostGIS vector }
        '503': { description: GeoServer unavailable }
  /api/v1/web-map/layers:
    get:
      tags: [Web Map]
      operationId: listWebMapLayers
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 50 } }
      responses:
        '200': { description: Published public or role-ACL layer catalog, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/web-map/layers/{layerId}/features/{featureId}:
    get:
      tags: [Web Map]
      operationId: getWebMapFeature
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LayerId' }
        - { name: featureId, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,120}$' } }
        - { name: includeGeometry, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Allowlisted feature attributes }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Layer is not a queryable vector }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/web-map/features/search:
    get:
      tags: [Web Map]
      operationId: searchWebMapFeatures
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: layerId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: bbox, in: query, schema: { type: string, example: '107.2,20.9,107.5,21.2' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: ACL-filtered Vietnamese feature matches }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/web-map/layers/{layerId}/legend:
    get:
      tags: [Web Map]
      operationId: getWebMapLegend
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/LayerId' }]
      responses:
        '200': { description: Layer style, legend and min/max zoom }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/web-map/basemaps:
    get:
      tags: [Web Map]
      operationId: listBasemaps
      security: [{}, { bearerAuth: [] }]
      responses:
        '200': { description: Enabled basemaps not requiring API keys }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/web-map/terrain:
    get:
      tags: [Web Map]
      operationId: listTerrainLayers
      security: [{}, { bearerAuth: [] }]
      responses:
        '200': { description: Public or role-ACL DEM/terrain layer catalog }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/web-map/terrain/{layerId}/url:
    get:
      tags: [Web Map]
      operationId: getTerrainUrl
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LayerId' }
        - { name: expireSeconds, in: query, schema: { type: integer, minimum: 60, maximum: 900, default: 300 } }
      responses:
        '200': { description: Short-lived MinIO presigned terrain URL }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ObjectId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    LayerId:
      name: layerId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    RoleCode:
      type: string
      enum: [system_admin, ubnd_tp, so_tnmt, so_xd, citizen]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }
    MfaChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string, minLength: 40, maxLength: 128, writeOnly: true }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string, minLength: 40, maxLength: 128, writeOnly: true }
        code: { type: string, pattern: '^\\d{6}$', writeOnly: true }
        recoveryCode: { type: string, minLength: 12, maxLength: 12, writeOnly: true }
      oneOf:
        - required: [code]
          not: { required: [recoveryCode] }
        - required: [recoveryCode]
          not: { required: [code] }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        fullName: { type: string, minLength: 2, maxLength: 255 }
        phone: { type: [string, 'null'] }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
    ShapefileImportRequest:
      type: object
      additionalProperties: false
      required: [fileObjectId, code, nameVi, category]
      properties:
        fileObjectId: { type: integer, format: int64, minimum: 1 }
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,58}$' }
        nameVi: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 50 }
        targetSrid: { type: integer, minimum: 1, maximum: 999999, default: 4326 }
        isPublic: { type: boolean, default: false }
        sourceEncoding: { type: string, enum: [UTF-8, CP1258, WINDOWS-1252] }
        topologyProfile: { type: string, enum: [basic, administrative_boundary], default: basic }
    ExcelImportRequest:
      type: object
      additionalProperties: false
      required: [fileObjectId, code, nameVi, category, sheetName, xColumn, yColumn, sourceSrid]
      properties:
        fileObjectId: { type: integer, format: int64, minimum: 1 }
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,58}$' }
        nameVi: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 50 }
        targetSrid: { type: integer, minimum: 1, maximum: 999999, default: 4326 }
        isPublic: { type: boolean, default: false }
        sheetName: { type: string, minLength: 1, maxLength: 120 }
        xColumn: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,62}$' }
        yColumn: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,62}$' }
        sourceSrid: { type: integer, minimum: 1, maximum: 999999 }
    LayerUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      minProperties: 2
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        nameVi: { type: string, minLength: 2, maxLength: 200 }
        category: { type: [string, 'null'], maxLength: 50 }
        styleName: { type: [string, 'null'], pattern: '^[A-Za-z][A-Za-z0-9_-]{0,79}$' }
        minZoom: { type: [integer, 'null'], minimum: 0, maximum: 24 }
        maxZoom: { type: [integer, 'null'], minimum: 0, maximum: 24 }
        legendConfig: { type: object }
        metadata: { type: object }
        isPublic: { type: boolean }
    LayerPermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [roleCode, canView, canExport, canEdit, canDelete]
            properties:
              roleCode: { $ref: '#/components/schemas/RoleCode' }
              canView: { type: boolean }
              canExport: { type: boolean }
              canEdit: { type: boolean }
              canDelete: { type: boolean }
    SuccessResponse:
      type: object
      required: [message, status, data]
      properties:
        message: { type: string }
        status: { type: integer }
        data: {}
        metadata: { type: object }
    ListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: { type: array, items: {} }
            metadata:
              type: object
              required: [page, limit, total, totalPages]
              properties:
                page: { type: integer }
                limit: { type: integer }
                total: { type: integer }
                totalPages: { type: integer }
    ErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        errors:
          type: array
          items: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Role permission or organization scope denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
